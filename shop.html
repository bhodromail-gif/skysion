<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/jpeg" href="images/img/logo/logo.jpeg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - SKYSION</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shop-container {
      padding: 150px 6% 80px 6%;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      cursor: pointer;
      padding: 10px;
      border: none;
    }

    .add-to-cart {
      background: #58111a;
      color: white;
    }

    .add-to-wishlist {
      background: transparent;
      border: 1px solid #d12e43;
      color: #d12e43;
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="images/img/logo/logo.jpeg" alt="SKYSION LOGO" id="nav-logo" width="120" height="40">
      </a>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="shop.html" class="active">SHOP</a></li>
        <li><a href="wishlist.html">WISHLIST</a></li>
        <li><a href="orders.html">MY ORDERS</a></li>
        <li><a href="account.html">ACCOUNT</a></li>
      </ul>
    </nav>
    <div class="nav-icons"><a href="cart.html">CART (<span id="cart-count">0</span>)</a></div>
  </header>

  <main class="shop-container">
    <h1 style="text-align: center; margin-bottom: 40px;">Our Collection</h1>
    <div class="product-grid" id="product-container">
      <!-- প্রোডাক্টগুলো এখানে লোড হবে -->
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SKYSION MAISON. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- জাভাস্ক্রিপ্ট ফাইলগুলো কোনো ফোল্ডারের ঝামেলা ছাড়াই সরাসরি রুট থেকে লোড হবে -->
  <script src="product.js"></script>
  <script src="cart.js"></script>

</body>

</html>
