<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - SKYSION</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shop-container {
      padding: 150px 6% 80px 6%;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }

    .product-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .product-card h3 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #fff;
    }

    .product-card p {
      font-size: 16px;
      color: #bbb;
      margin-bottom: 15px;
    }

    .size-selector {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .size-selector select {
      padding: 6px 12px;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-to-cart-btn {
      padding: 10px 15px;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .add-to-cart-btn:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo">
      <a href="index.html"><img src="images/img/logo/logo.jpeg" alt="Logo" width="120" height="40"></a>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="shop.html" class="active">SHOP</a></li>
        <li><a href="wishlist.html">WISHLIST</a></li>
        <li><a href="orders.html">MY ORDERS</a></li>
        <li><a href="account.html">ACCOUNT</a></li>
      </ul>
    </nav>
    <div class="nav-icons"><a href="cart.html">CART (<span id="cart-count">0</span>)</a></div>
  </header>

  <main class="shop-container">
    <h1 style="text-align: center; margin-bottom: 40px; color: #fff;">Our Collection</h1>
    <div class="product-grid" id="product-container"></div>
  </main>

  <footer>
    <p>&copy; 2026 SKYSION MAISON. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- জাভাস্ক্রিপ্ট ফাইলগুলো সঠিক ক্রমে সংযুক্ত -->
  <script src="js/product.js"></script>
  <script src="js/cart.js"></script>

</body>

</html>
