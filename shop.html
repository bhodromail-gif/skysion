<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - SKYSION</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shop-container {
      padding: 150px 6% 80px 6%;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo">
      <a href="index.html"><img src="images/img/logo/logo.jpeg" alt="Logo" width="120" height="40"></a>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="shop.html" class="active">SHOP</a></li>
        <li><a href="wishlist.html">WISHLIST</a></li>
        <li><a href="orders.html">MY ORDERS</a></li>
        <li><a href="account.html">ACCOUNT</a></li>
      </ul>
    </nav>
    <div class="nav-icons"><a href="cart.html">CART (<span id="cart-count">0</span>)</a></div>
  </header>

  <main class="shop-container">
    <h1 style="text-align: center; margin-bottom: 40px;">Our Collection</h1>
    <div class="product-grid" id="product-container"></div>
  </main>

  <footer>
    <p>&copy; 2026 SKYSION MAISON. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- সঠিক পাথ -->
  <script src="js/product.js"></script>
  <script src="js/cart.js"></script>

</body>

</html>
